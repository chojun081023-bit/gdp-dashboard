# Tool configuration only (this app is not packaged).

[tool.ruff]
line-length = 100
target-version = "py311"  # matches .devcontainer (python:3.11)
extend-exclude = [".claude"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) + import sorting.
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"  # keep the existing template's style

[tool.pytest.ini_options]
testpaths = ["tests"]
